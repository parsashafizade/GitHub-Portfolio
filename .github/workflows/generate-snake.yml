name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

jobs:
  snake:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate snake
        uses: Platane/snk@v3
        with:

          github_user_name: parsashafizade

          outputs: |
            Gaming/assets/snake/github-contribution-grid-snake.svg?palette=github-dark


      - name: Commit snake
        uses: EndBug/add-and-commit@v9
        with:

          message: "Update contribution snake"

          add: Gaming/assets/snake/github-contribution-grid-snake.svg
