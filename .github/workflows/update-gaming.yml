name: Update Gaming Profile HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

  push:
    paths:
      - "Gaming/scripts/generate-gaming-profile.py"

permissions:
  contents: write

concurrency:
  group: gaming-profile-update
  cancel-in-progress: true

jobs:
  update-profile:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Generate Gaming HUD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_REPOS_TOKEN: ${{ secrets.PROFILE_REPOS_TOKEN }}
          GITHUB_USERNAME: parsashafizade
        run: |
          python Gaming/scripts/generate-gaming-profile.py

      - name: Commit generated SVG
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gaming/assets/*.svg

          if git diff --cached --quiet; then
            echo "No SVG changes"
            exit 0
          fi

          git commit -m "chore: update gaming HUD assets"

          git pull --rebase origin main

          git push origin main
