name: Update Gaming Profile

on:
  schedule:
    - cron: "20 4 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Generate Gaming assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python Gaming/scripts/generate-gaming-profile.py


      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gaming/assets

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update Gaming profile assets"
          git push
