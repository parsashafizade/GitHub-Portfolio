# Starter-kit note:
# GitHub executes workflow files only from the repository-root
# .github/workflows directory.
#
# When installing the Minimal style into a GitHub Profile repository,
# place this file at:
#
# .github/workflows/update-github-snapshot.yml
#
# The generator step below supports both:
#   1. A selected Minimal style copied to repository root.
#   2. The original starter-kit layout containing Minimal/.

name: Update GitHub Snapshot

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/generate-github-snapshot.py"
      - "Minimal/scripts/generate-github-snapshot.py"
      - ".github/workflows/update-github-snapshot.yml"
      - "Minimal/.github/workflows/update-github-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: github-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate GitHub snapshot
        id: generate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -f "scripts/generate-github-snapshot.py" ]]; then
            SCRIPT_PATH="scripts/generate-github-snapshot.py"
            SVG_PATH="assets/github-snapshot.svg"
          elif [[ -f "Minimal/scripts/generate-github-snapshot.py" ]]; then
            SCRIPT_PATH="Minimal/scripts/generate-github-snapshot.py"
            SVG_PATH="Minimal/assets/github-snapshot.svg"
          else
            echo "Generator script not found." >&2
            exit 1
          fi

          python "$SCRIPT_PATH"

          if [[ ! -f "$SVG_PATH" ]]; then
            echo "Expected SVG was not generated: $SVG_PATH" >&2
            exit 1
          fi

          echo "svg_path=$SVG_PATH" >> "$GITHUB_OUTPUT"

      - name: Commit updated snapshot
        shell: bash
        env:
          SVG_PATH: ${{ steps.generate.outputs.svg_path }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$SVG_PATH"

          if git diff --cached --quiet; then
            echo "GitHub snapshot is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub signal snapshot"
          git pull --rebase
          git push
