name: Generate GitHub Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: parsashafizade
          outputs: |
            Gaming/assets/activity/github-snake.svg?palette=github-dark
            Gaming/assets/activity/github-snake-dark.svg?palette=github-dark

      - name: Commit generated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gaming/assets/activity/github-snake.svg Gaming/assets/activity/github-snake-dark.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub contribution snake"
          git push
