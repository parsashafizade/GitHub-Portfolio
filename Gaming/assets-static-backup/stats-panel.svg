<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img">

<title>Parsa Shafizade GitHub Stats Board</title>

<desc>
Arcade scoreboard interface showing GitHub performance metrics.
</desc>


<style>

*{
font-family:monospace
}

.bg{
fill:#060914
}

.panel{
fill:#10162c;
stroke:#ffe66d;
stroke-width:3
}

.label{
fill:#9da8c8
}

.value{
fill:#ffffff
}

.gold{
fill:#ffe66d
}

.bar{
fill:#22e6ff
}

.pulse{
animation:pulse 2s infinite
}

@keyframes pulse{
50%{
opacity:.4
}
}

@media(prefers-reduced-motion:reduce){
.pulse{
animation:none
}
}

</style>


<rect width="900" height="450" class="bg"/>


<rect x="40" y="40" width="820" height="370" rx="16" class="panel"/>


<text x="80" y="95" class="gold" font-size="30">
HIGH SCORE BOARD
</text>


<g transform="translate(80 140)">

<text class="label" font-size="16">
CONTRIBUTIONS
</text>

<text x="260" class="value" font-size="28">
1,248
</text>


<rect y="35" width="420" height="8" class="bar"/>


</g>



<g transform="translate(80 230)">

<text class="label" font-size="16">
PUBLIC REPOS
</text>

<text x="260" class="value" font-size="28">
24
</text>

<rect y="35" width="300" height="8" class="bar"/>

</g>



<g transform="translate(500 140)">

<text class="label" font-size="16">
STARS
</text>

<text x="180" class="value" font-size="28">
128
</text>


<text y="90" class="label" font-size="16">
FOLLOWERS
</text>

<text x="180" y="90" class="value" font-size="28">
42
</text>

</g>


<circle cx="790" cy="90" r="9" fill="#7cff8a" class="pulse"/>


</svg>