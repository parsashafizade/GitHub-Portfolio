<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img">
<title>Parsa Shafizade Contribution Map</title>
<desc>
Retro arcade styled GitHub contribution calendar showing activity intensity.
</desc>

<style>
*{
font-family:monospace
}

.bg{
fill:#060914
}

.panel{
fill:#0d1429;
stroke:#22e6ff;
stroke-width:3
}

.grid{
fill:#151d35;
stroke:#202b4b;
stroke-width:1
}

.low{
fill:#174b55
}

.mid{
fill:#13a7b8
}

.high{
fill:#ffe66d
}

.text{
fill:#f7f7ff
}

.sub{
fill:#9da8c8
}

.cursor{
animation:blink 1.4s infinite
}

@keyframes blink{
50%{opacity:.25}
}

@media(prefers-reduced-motion:reduce){
.cursor{
animation:none
}
}

</style>


<rect width="1000" height="430" class="bg"/>


<rect x="35" y="35" width="930" height="360" rx="16" class="panel"/>


<text x="70" y="85" class="text" font-size="24">
ACTIVITY MAP
</text>

<circle cx="255" cy="76" r="7" fill="#7cff8a" class="cursor"/>


<text x="70" y="120" class="sub" font-size="16">
1,248 CONTRIBUTIONS  •  220 ACTIVE DAYS
</text>


<!-- Month labels -->
<text x="210" y="165" class="sub" font-size="14">
JAN
</text>

<text x="410" y="165" class="sub" font-size="14">
APR
</text>

<text x="610" y="165" class="sub" font-size="14">
JUL
</text>

<text x="810" y="165" class="sub" font-size="14">
OCT
</text>


<!-- Contribution grid -->
<g transform="translate(110 190)">

<g>
<rect x="0" y="0" width="18" height="18" class="grid"/>
<rect x="24" y="0" width="18" height="18" class="low"/>
<rect x="48" y="0" width="18" height="18" class="mid"/>
<rect x="72" y="0" width="18" height="18" class="high"/>

<rect x="0" y="24" width="18" height="18" class="mid"/>
<rect x="24" y="24" width="18" height="18" class="high"/>
<rect x="48" y="24" width="18" height="18" class="low"/>
<rect x="72" y="24" width="18" height="18" class="mid"/>

<rect x="0" y="48" width="18" height="18" class="high"/>
<rect x="24" y="48" width="18" height="18" class="mid"/>
<rect x="48" y="48" width="18" height="18" class="high"/>
<rect x="72" y="48" width="18" height="18" class="low"/>
</g>


<!-- repeated map area -->
<g transform="translate(110 0)">
<rect width="400" height="90"
fill="#10182e"
stroke="#202b4b"/>
</g>

<g transform="translate(530 0)">
<rect width="220" height="90"
fill="#10182e"
stroke="#202b4b"/>
</g>


</g>


<text x="120" y="340" class="sub" font-size="14">
LESS
</text>

<rect x="170" y="325" width="16" height="16" class="grid"/>
<rect x="195" y="325" width="16" height="16" class="low"/>
<rect x="220" y="325" width="16" height="16" class="mid"/>
<rect x="245" y="325" width="16" height="16" class="high"/>

<text x="280" y="340" class="sub" font-size="14">
MORE
</text>


</svg>