<svg role="img" aria-labelledby="title desc" width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
<title id="title">NEXUS ENGINEERING COMMAND OS Identity Boot Screen</title>
<desc id="desc">A futuristic engineering command interface showing an engineer profile initialization sequence.</desc>

<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#050816"/>
    <stop offset="0.5" stop-color="#081226"/>
    <stop offset="1" stop-color="#101A35"/>
  </linearGradient>
  <linearGradient id="cyan">
    <stop stop-color="#00E5FF"/>
    <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="core">
    <stop stop-color="#00E5FF" stop-opacity=".8"/>
    <stop offset=".5" stop-color="#A855F7" stop-opacity=".35"/>
    <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#00E5FF" stroke-opacity=".08"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <style>
    text{font-family:'Orbitron','Rajdhani','Space Mono',monospace;fill:#dffaff;letter-spacing:2px}
    .pulse{animation:pulse 3s infinite}
    .scan{animation:scan 5s linear infinite}
    .spin{animation:spin 18s linear infinite}
    @keyframes pulse{50%{opacity:.35}}
    @keyframes scan{from{transform:translateY(-220px)}to{transform:translateY(420px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.pulse,.scan,.spin{animation:none}}
  </style>
  <symbol id="corner">
    <path d="M0 28V0h28M0 0l12 12" fill="none" stroke="#00E5FF" stroke-width="2"/>
  </symbol>
</defs>

<rect width="1000" height="400" fill="url(#bg)"/>
<rect width="1000" height="400" fill="url(#grid)"/>

<g opacity=".4">
  <path d="M0 80H1000M0 320H1000" stroke="#A855F7"/>
  <path d="M80 0V400M920 0V400" stroke="#00E5FF"/>
</g>

<rect x="25" y="20" width="950" height="360" rx="14" fill="none" stroke="#00E5FF" stroke-opacity=".35"/>
<rect x="35" y="30" width="930" height="340" rx="10" fill="none" stroke="#A855F7" stroke-opacity=".25"/>

<use href="#corner" x="25" y="20"/>
<use href="#corner" x="975" y="380" transform="rotate(180 975 380)"/>

<text x="60" y="65" font-size="14" fill="#00E5FF">NEXUS ENGINEERING COMMAND OS</text>
<text x="60" y="88" font-size="11">SYSTEM_VERSION: NEXUS-1.0 // INITIALIZING PROFILE LINK</text>

<g transform="translate(500 205)">
  <circle r="120" fill="url(#core)" opacity=".25" class="pulse"/>
  <circle r="95" fill="none" stroke="#00E5FF" stroke-opacity=".5"/>
  <circle r="110" fill="none" stroke="#A855F7" stroke-dasharray="12 18" class="spin"/>
  <circle r="62" fill="#050816" stroke="#FFE66D" stroke-opacity=".5"/>
  <path d="M-50 0H50M0-50V50" stroke="#00E5FF" opacity=".35"/>
  <text x="-90" y="8" font-size="22" fill="#FFE66D">parsashafizade</text>
</g>

<g>
<rect x="70" y="130" width="270" height="150" rx="12" fill="#081226" stroke="#00E5FF" stroke-opacity=".45"/>
<text x="95" y="160" font-size="12" fill="#00E5FF">PLAYER_ID</text>
<text x="95" y="190" font-size="18">parsashafizade</text>
<text x="95" y="220" font-size="13">Mobile Application Developer</text>
<text x="95" y="250" font-size="11" fill="#7CFF8A">STATUS: ONLINE</text>
</g>

<g>
<rect x="660" y="120" width="260" height="180" rx="12" fill="#081226" stroke="#A855F7" stroke-opacity=".45"/>
<text x="685" y="150" font-size="12" fill="#A855F7">ENGINE PROFILE</text>
<text x="685" y="180" font-size="13">CLASS: Software Engineer</text>
<text x="685" y="210" font-size="13">LEVEL: ENGINEER / PRODUCT BUILDER</text>
<text x="685" y="240" font-size="12">CORE: Flutter / AI Assisted Development</text>
<rect x="685" y="260" width="180" height="8" fill="#050816" stroke="#00E5FF"/>
<rect x="685" y="260" width="80" height="8" fill="#00E5FF"/>
</g>

<g class="scan" opacity=".15">
<rect x="40" y="0" width="920" height="4" fill="#00E5FF"/>
</g>

<text x="60" y="345" font-size="11">AI-ASSISTED DEVELOPMENT // MOBILE SYSTEMS // PRODUCT ENGINEERING</text>
<text x="770" y="345" font-size="11" fill="#7CFF8A">ENERGY 100%</text>
</svg>