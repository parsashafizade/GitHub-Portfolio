<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img">
<title>Developer Loadout Inventory</title>
<desc>Arcade inventory panel showing programming tools and technologies.</desc>

<style>
*{font-family:monospace}
.bg{fill:#070b18}
.box{fill:#10162b;stroke:#22e6ff;stroke-width:2}
.txt{fill:#f7f7ff}
.gold{fill:#ffe66d}
.pulse{animation:p 1.8s infinite}
@keyframes p{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>

<rect width="900" height="420" class="bg"/>

<text x="50" y="60" class="gold" font-size="28">
LOADOUT // EQUIPMENT
</text>

<g transform="translate(50 100)">
<rect width="370" height="110" class="box"/>
<text x="25" y="35" class="gold">MOBILE SLOT</text>
<text x="25" y="70" class="txt">Flutter</text>
<text x="170" y="70" class="txt">Dart</text>
</g>

<g transform="translate(480 100)">
<rect width="370" height="110" class="box"/>
<text x="25" y="35" class="gold">LANGUAGE SLOT</text>
<text x="25" y="70" class="txt">Python</text>
<text x="170" y="70" class="txt">C++</text>
<text x="270" y="70" class="txt">Java</text>
</g>

<g transform="translate(50 250)">
<rect width="370" height="110" class="box"/>
<text x="25" y="35" class="gold">TOOL SLOT</text>
<text x="25" y="70" class="txt">Git</text>
<text x="130" y="70" class="txt">GitHub</text>
<text x="260" y="70" class="txt">Figma</text>
</g>

<g transform="translate(480 250)">
<rect width="370" height="110" class="box"/>
<text x="25" y="35" class="gold">AI MODULE</text>
<text x="25" y="70" class="txt">AI Workflow</text>
<circle cx="330" cy="70" r="9" fill="#7cff8a" class="pulse"/>
</g>

</svg>