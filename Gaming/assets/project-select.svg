<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img">
<title>Project Select Mission Screen</title>
<desc>Arcade mission selection interface for featured GitHub repositories.</desc>

<style>
*{font-family:monospace}
.bg{fill:#060914}
.card{fill:#10162d;stroke:#ff4fd8;stroke-width:3}
.title{fill:#ffe66d}
.text{fill:#fff}
.small{fill:#9ba8c7}
.active{animation:pulse 2s infinite}
@keyframes pulse{50%{stroke:#22e6ff}}
@media(prefers-reduced-motion:reduce){.active{animation:none}}
</style>

<rect width="1000" height="620" class="bg"/>

<text x="70" y="80" class="title" font-size="34">
MISSION SELECT
</text>

<g transform="translate(70 130)">
<rect width="400" height="150" class="card active"/>
<text x="25" y="45" class="text" font-size="22">
raccoon-login-experience
</text>
<text x="25" y="80" class="small">
No project
</text>
<text x="25" y="115" class="title">
LOCKED
</text>
</g>

<g transform="translate(530 130)">
<rect width="400" height="150" class="card"/>
<text x="25" y="45" class="text" font-size="22">
persian-auto-gallery-frontend
</text>
<text x="25" y="80" class="small">
No project
</text>
<text x="25" y="115" class="title">
LOCKED
</text>
</g>

<g transform="translate(70 330)">
<rect width="400" height="150" class="card"/>
<text x="25" y="45" class="text" font-size="22">
hardware-reserve
</text>
<text x="25" y="80" class="small">
No project
</text>
<text x="25" y="115" class="title">
LOCKED
</text>
</g>

<g transform="translate(530 330)">
<rect width="400" height="150" class="card"/>
<text x="25" y="45" class="text" font-size="22">
EMPTY SLOT
</text>
<text x="25" y="80" class="small">
No project
</text>
<text x="25" y="115" class="title">
LOCKED
</text>
</g>

<text x="70" y="570" class="small">
AUTO GENERATED FROM GITHUB PROFILE DATA
</text>

</svg>