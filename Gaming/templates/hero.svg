<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img">
<title>Parsa Shafizade Arcade Hero</title>
<desc>Retro arcade style developer profile introduction screen.</desc>

<style>
*{font-family:monospace}
.bg{fill:#070b1a}
.panel{fill:#0d1328;stroke:#22e6ff;stroke-width:3}
.neon{fill:#ffe66d}
.text{fill:#f5f7ff}
.sub{fill:#9da9c7}
.line{stroke:#ff4fd8;stroke-width:2}
.glow{animation:pulse 2s infinite}
.scan{animation:move 4s linear infinite}
@keyframes pulse{50%{opacity:.45}}
@keyframes move{to{transform:translateY(80px)}}
@media(prefers-reduced-motion:reduce){
.glow,.scan{animation:none}
}
</style>

<rect width="1200" height="420" class="bg"/>

<g opacity=".12">
<path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"
stroke="#22e6ff"/>
<path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"
stroke="#22e6ff"/>
</g>

<rect x="55" y="45" width="1090" height="330" rx="12" class="panel"/>

<rect x="70" y="60" width="1060" height="6" fill="#ff4fd8" class="scan"/>

<text x="90" y="125" font-size="22" class="sub">PLAYER PROFILE // ONLINE</text>

<text x="90" y="205" font-size="58" class="neon">
PARSA SHAFIZADE
</text>

<text x="92" y="250" font-size="24" class="text">
MOBILE DEVELOPER • PRODUCT BUILDER • AI-ASSISTED DEV
</text>

<text x="92" y="300" font-size="20" class="sub">
MODE: BUILDING • STATUS: ACTIVE
</text>

<g transform="translate(90 335)">
<rect width="960" height="35" fill="#111a35" stroke="#22e6ff"/>
<text x="20" y="24" class="text" font-size="16">
REPOS  //  CONTRIBUTIONS  //  DAYS  //  STARS
</text>
<circle cx="920" cy="18" r="8" fill="#7cff8a" class="glow"/>
</g>

</svg>