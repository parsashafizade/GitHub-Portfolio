<svg width="430" height="180" viewBox="0 0 430 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Parsa Shafizade Language Mix</title>
<desc id="desc">Top public repository languages using byte-weighted public code.</desc>


<defs>
  <linearGradient id="lang-bg" x1="12" y1="8" x2="418" y2="174">
    <stop stop-color="#0B1120"/>
    <stop offset=".56" stop-color="#0D1627"/>
    <stop offset="1" stop-color="#0F172A"/>
  </linearGradient>

  <linearGradient id="lang-edge" x1="0" y1="0" x2="430" y2="180">
    <stop stop-color="#22D3EE" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#334155" stop-opacity=".58"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity=".17"/>
  </linearGradient>

  <pattern id="lang-grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" stroke="#94A3B8" stroke-opacity=".043"/>
    <circle cx="1" cy="1" r=".65" fill="#22D3EE" fill-opacity=".045"/>
  </pattern>

  <clipPath id="lang-clip">
    <rect x=".5" y=".5" width="429" height="179" rx="18"/>
  </clipPath>
</defs>


<style>
  .sans {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .reveal {
    opacity: 0;
    transform: translateY(5px);
    animation: reveal .65s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .d2 { animation-delay: .09s; }
  .d3 { animation-delay: .18s; }

  .pulse {
    animation: pulse 4.2s ease-in-out infinite 1.1s;
  }

  .scan {
    animation: scan 7.4s ease-in-out infinite 1.3s;
  }

  .trace {
    stroke-dasharray: 160;
    stroke-dashoffset: 160;
    animation: trace 1.2s cubic-bezier(.4,0,.2,1) .28s forwards;
  }

  @keyframes reveal {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes pulse {
    0%,100% { opacity: .38; }
    50% { opacity: 1; }
  }

  @keyframes scan {
    0%,22% {
      transform: translateX(0);
      opacity: 0;
    }

    34% { opacity: .72; }
    72% { opacity: .24; }

    82%,100% {
      transform: translateX(52px);
      opacity: 0;
    }
  }

  @keyframes trace {
    to { stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal,
    .pulse,
    .scan,
    .trace {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      stroke-dashoffset: 0 !important;
    }
  }
</style>


<rect x=".5" y=".5" width="429" height="179" rx="18" fill="url(#lang-bg)"/>

<g clip-path="url(#lang-clip)">
  <rect width="430" height="180" fill="url(#lang-grid)"/>
  <path d="M287 -20L451 87" stroke="#3B82F6" stroke-opacity=".03" stroke-width="64"/>
</g>

<rect x=".5" y=".5" width="429" height="179" rx="18" stroke="url(#lang-edge)"/>

<g class="sans reveal">
  <circle cx="23" cy="23" r="3.2" fill="#38BDF8" class="pulse"/>
  <text x="396" y="26.5" text-anchor="end" fill="#64748B" font-size="8.2" font-weight="700" letter-spacing="1.2">LANGUAGE MIX · PUBLIC REPOSITORIES</text>
  <text x="20" y="43" fill="#F8FAFC" font-size="15.5" font-weight="760">Development Stack</text>
</g>


<g class="reveal d2">
  <text class="sans" x="20" y="58" fill="#CBD5E1" font-size="9.2" font-weight="650">TypeScript</text>
  <text class="mono" x="397" y="58" text-anchor="end" fill="#64748B" font-size="7.6">28.9%</text>

  <rect x="126" y="51" width="194" height="6" rx="3" fill="#111C2D"/>
  <rect x="126" y="51" width="56.1" height="6" rx="3" fill="#22D3EE" fill-opacity=".72"/>

  <circle cx="334" cy="54" r="2.4" fill="#22D3EE" class="pulse"/>
</g>

<g class="reveal d2">
  <text class="sans" x="20" y="78" fill="#CBD5E1" font-size="9.2" font-weight="650">Python</text>
  <text class="mono" x="397" y="78" text-anchor="end" fill="#64748B" font-size="7.6">19.5%</text>

  <rect x="126" y="71" width="194" height="6" rx="3" fill="#111C2D"/>
  <rect x="126" y="71" width="37.8" height="6" rx="3" fill="#38BDF8" fill-opacity=".72"/>

  <circle cx="334" cy="74" r="2.4" fill="#38BDF8" class="pulse"/>
</g>

<g class="reveal d2">
  <text class="sans" x="20" y="98" fill="#CBD5E1" font-size="9.2" font-weight="650">CSS</text>
  <text class="mono" x="397" y="98" text-anchor="end" fill="#64748B" font-size="7.6">15.1%</text>

  <rect x="126" y="91" width="194" height="6" rx="3" fill="#111C2D"/>
  <rect x="126" y="91" width="29.3" height="6" rx="3" fill="#3B82F6" fill-opacity=".72"/>

  <circle cx="334" cy="94" r="2.4" fill="#3B82F6" class="pulse"/>
</g>

<g class="reveal d2">
  <text class="sans" x="20" y="118" fill="#CBD5E1" font-size="9.2" font-weight="650">C#</text>
  <text class="mono" x="397" y="118" text-anchor="end" fill="#64748B" font-size="7.6">14.2%</text>

  <rect x="126" y="111" width="194" height="6" rx="3" fill="#111C2D"/>
  <rect x="126" y="111" width="27.5" height="6" rx="3" fill="#60A5FA" fill-opacity=".72"/>

  <circle cx="334" cy="114" r="2.4" fill="#60A5FA" class="pulse"/>
</g>

<g class="reveal d2">
  <text class="sans" x="20" y="138" fill="#CBD5E1" font-size="9.2" font-weight="650">Dart</text>
  <text class="mono" x="397" y="138" text-anchor="end" fill="#64748B" font-size="7.6">11.1%</text>

  <rect x="126" y="131" width="194" height="6" rx="3" fill="#111C2D"/>
  <rect x="126" y="131" width="21.6" height="6" rx="3" fill="#818CF8" fill-opacity=".72"/>

  <circle cx="334" cy="134" r="2.4" fill="#818CF8" class="pulse"/>
</g>


<line x1="20" y1="155" x2="410" y2="155" stroke="#1E293B"/>

<g class="mono reveal d3">
  <text x="20" y="171" fill="#475569" font-size="6.9">BYTE-WEIGHTED PUBLIC CODE</text>
  <text x="410" y="171" text-anchor="end" fill="#64748B" font-size="6.9">TOP 5</text>
</g>
</svg>
