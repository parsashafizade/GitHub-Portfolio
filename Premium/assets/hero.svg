<svg width="100%" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Parsa Shafizade — Premium GitHub Profile Hero</title>
  <desc id="desc">A premium dark technical banner introducing Parsa Shafizade as a mobile application developer, product-minded builder, and AI-assisted developer, with a structured idea-to-product execution system.</desc>

  <defs>
    <!-- Background and depth -->
    <linearGradient id="hero-bg" x1="42" y1="18" x2="858" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.56" stop-color="#0D1528"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hero-edge" x1="0" y1="0" x2="900" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="0.42" stop-color="#334155" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#38BDF8"/>
      <stop offset="0.72" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="module-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172033" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="soft-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(735 132) rotate(125) scale(220 180)">
      <stop stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
      <circle cx="1" cy="1" r="0.8" fill="#38BDF8" fill-opacity="0.055"/>
    </pattern>
    <clipPath id="panel-clip">
      <rect x="1" y="1" width="898" height="328" rx="24"/>
    </clipPath>
    <filter id="blue-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .text-reveal { opacity: 0; transform: translateY(8px); animation: textIn .72s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .08s; }
    .d2 { animation-delay: .16s; }
    .d3 { animation-delay: .24s; }
    .d4 { animation-delay: .32s; }
    .path-draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: drawPath 1.25s cubic-bezier(.4,0,.2,1) .3s forwards; }
    .rail-fill { transform-origin: left center; transform: scaleX(0); animation: growRail 1.05s cubic-bezier(.4,0,.2,1) .38s forwards; }
    .pulse-a { animation: pulseA 3.6s ease-in-out infinite 1.1s; }
    .pulse-b { animation: pulseB 4.4s ease-in-out infinite 1.7s; }
    .signal { animation: signalMove 6.8s cubic-bezier(.45,.05,.55,.95) infinite 1.2s; }
    .scan { animation: scanMove 7.2s ease-in-out infinite 1.6s; }
    .ambient { animation: ambient 5.8s ease-in-out infinite 1.3s; }
    .bar-a { animation: barA 4.8s ease-in-out infinite 1.5s; transform-origin: left center; }
    .bar-b { animation: barB 5.4s ease-in-out infinite 1.8s; transform-origin: left center; }

    @keyframes textIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes drawPath {
      to { stroke-dashoffset: 0; }
    }

    @keyframes growRail {
      to { transform: scaleX(1); }
    }

    @keyframes pulseA {
      0%,100% { opacity: .58; }
      50% { opacity: 1; }
    }

    @keyframes pulseB {
      0%,100% { opacity: .34; }
      48% { opacity: .82; }
    }

    @keyframes signalMove {
      0% { transform: translateX(0); opacity: 0; }
      10% { opacity: 1; }
      84% { opacity: 1; }
      100% { transform: translateX(222px); opacity: 0; }
    }

    @keyframes scanMove {
      0%,20% { transform: translateX(0); opacity: 0; }
      30% { opacity: .7; }
      68% { opacity: .34; }
      78%,100% { transform: translateX(118px); opacity: 0; }
    }

    @keyframes ambient {
      0%,100% { opacity: .22; }
      50% { opacity: .48; }
    }

    @keyframes barA {
      0%,100% { transform: scaleX(.58); opacity: .6; }
      50% { transform: scaleX(.92); opacity: .95; }
    }

    @keyframes barB {
      0%,100% { transform: scaleX(.76); opacity: .42; }
      50% { transform: scaleX(.44); opacity: .8; }
    }

    @media (prefers-reduced-motion: reduce) {
      .text-reveal,
      .path-draw,
      .rail-fill,
      .pulse-a,
      .pulse-b,
      .signal,
      .scan,
      .ambient,
      .bar-a,
      .bar-b {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

  <!-- Main panel -->
  <rect x="1" y="1" width="898" height="328" rx="24" fill="url(#hero-bg)"/>
  <g clip-path="url(#panel-clip)">
    <rect x="1" y="1" width="898" height="328" fill="url(#micro-grid)"/>
    <rect x="484" y="1" width="415" height="328" fill="url(#soft-glow)"/>
    <path d="M-20 284C131 244 260 253 393 301" stroke="#38BDF8" stroke-opacity="0.035" stroke-width="66"/>
    <path d="M522 -16C622 58 748 57 930 16" stroke="#6366F1" stroke-opacity="0.03" stroke-width="54"/>
  </g>
  <rect x="1" y="1" width="898" height="328" rx="24" stroke="url(#hero-edge)"/>

  <!-- Identity block -->
  <g class="sans">
    <g class="text-reveal d1">
      <rect x="48" y="44" width="184" height="27" rx="13.5" fill="#0F1B2E" stroke="#38BDF8" stroke-opacity="0.28"/>
      <circle cx="63" cy="57.5" r="3.5" fill="#22D3EE" class="pulse-a"/>
      <text x="74" y="61.5" fill="#A5F3FC" font-size="10.5" font-weight="700" letter-spacing="1.35">MOBILE × PRODUCT × AI</text>
    </g>

    <text class="text-reveal d2" x="48" y="116" fill="#F8FAFC" font-size="34" font-weight="800" letter-spacing="0.2">PARSA SHAFIZADE</text>
    <text class="text-reveal d2" x="48" y="148" fill="#E2E8F0" font-size="18" font-weight="650">Mobile Application Developer</text>
    <text class="text-reveal d3" x="48" y="174" fill="#94A3B8" font-size="13.5" font-weight="520">Product-minded Builder · AI-assisted Development</text>

    <g class="text-reveal d3">
      <rect x="48" y="196" width="356" height="1" fill="url(#accent-line)"/>
      <text x="48" y="224" fill="#CBD5E1" font-size="12.8" font-weight="480">Building practical digital products from idea to implementation.</text>
    </g>

    <g class="text-reveal d4 mono" font-size="9.5" font-weight="700" letter-spacing="1.1">
      <g>
        <rect x="48" y="250" width="72" height="27" rx="8" fill="#101B2C" stroke="#334155" stroke-opacity="0.76"/>
        <text x="65" y="267.7" fill="#BAE6FD">FLUTTER</text>
      </g>
      <g>
        <rect x="128" y="250" width="79" height="27" rx="8" fill="#101B2C" stroke="#334155" stroke-opacity="0.76"/>
        <text x="145" y="267.7" fill="#CFFAFE">PRODUCT</text>
      </g>
      <g>
        <rect x="215" y="250" width="65" height="27" rx="8" fill="#101B2C" stroke="#334155" stroke-opacity="0.76"/>
        <text x="233" y="267.7" fill="#BFDBFE">BUILD</text>
      </g>
      <g>
        <rect x="288" y="250" width="77" height="27" rx="8" fill="#101B2C" stroke="#334155" stroke-opacity="0.76"/>
        <text x="303" y="267.7" fill="#C7D2FE">ITERATE</text>
      </g>
    </g>
  </g>

  <!-- Product build system -->
  <g filter="url(#soft-shadow)">
    <rect x="474" y="38" width="378" height="254" rx="20" fill="#0A1220" fill-opacity="0.78" stroke="#334155" stroke-opacity="0.82"/>
    <rect x="486" y="50" width="354" height="230" rx="15" fill="#0D1625" fill-opacity="0.74" stroke="#1E293B"/>
  </g>

  <!-- System header -->
  <g class="mono">
    <text x="504" y="72" fill="#64748B" font-size="8.8" letter-spacing="1.6">PRODUCT BUILD SYSTEM</text>
    <circle cx="800" cy="68.5" r="3" fill="#22D3EE" class="pulse-b"/>
    <text x="809" y="72" fill="#67E8F9" font-size="8.4" letter-spacing="1">ACTIVE</text>
  </g>
  <line x1="504" y1="84" x2="822" y2="84" stroke="#334155" stroke-opacity="0.72"/>

  <!-- Four-stage architectural modules -->
  <g class="sans">
    <g>
      <rect x="504" y="101" width="142" height="54" rx="11" fill="url(#module-fill)" stroke="#334155"/>
      <rect x="504" y="101" width="3" height="54" rx="1.5" fill="#38BDF8" fill-opacity="0.9"/>
      <text x="519" y="120" fill="#7DD3FC" font-size="9" font-weight="750" letter-spacing="1.2">01 · THINK</text>
      <text x="519" y="139" fill="#E2E8F0" font-size="11.3" font-weight="600">Define the real problem</text>
      <circle cx="629" cy="117" r="3.2" fill="#38BDF8" fill-opacity="0.9" class="pulse-a"/>
    </g>

    <g>
      <rect x="681" y="101" width="141" height="54" rx="11" fill="url(#module-fill)" stroke="#334155"/>
      <rect x="819" y="101" width="3" height="54" rx="1.5" fill="#22D3EE" fill-opacity="0.84"/>
      <text x="696" y="120" fill="#67E8F9" font-size="9" font-weight="750" letter-spacing="1.2">02 · BUILD</text>
      <text x="696" y="139" fill="#E2E8F0" font-size="11.3" font-weight="600">Turn logic into product</text>
      <circle cx="804" cy="117" r="3.2" fill="#22D3EE" fill-opacity="0.78" class="pulse-b"/>
    </g>

    <g>
      <rect x="504" y="196" width="142" height="54" rx="11" fill="url(#module-fill)" stroke="#334155"/>
      <rect x="504" y="196" width="3" height="54" rx="1.5" fill="#60A5FA" fill-opacity="0.72"/>
      <text x="519" y="215" fill="#93C5FD" font-size="9" font-weight="750" letter-spacing="1.2">04 · ITERATE</text>
      <text x="519" y="234" fill="#E2E8F0" font-size="11.3" font-weight="600">Learn, refine, improve</text>
      <circle cx="629" cy="212" r="3.2" fill="#60A5FA" fill-opacity="0.75" class="pulse-b"/>
    </g>

    <g>
      <rect x="681" y="196" width="141" height="54" rx="11" fill="url(#module-fill)" stroke="#334155"/>
      <rect x="819" y="196" width="3" height="54" rx="1.5" fill="#818CF8" fill-opacity="0.68"/>
      <text x="696" y="215" fill="#A5B4FC" font-size="9" font-weight="750" letter-spacing="1.2">03 · SHIP</text>
      <text x="696" y="234" fill="#E2E8F0" font-size="11.3" font-weight="600">Deliver usable value</text>
      <circle cx="804" cy="212" r="3.2" fill="#818CF8" fill-opacity="0.72" class="pulse-a"/>
    </g>
  </g>

  <!-- Execution rail -->
  <g>
    <path class="path-draw" d="M646 128H663C670 128 675 133 675 140V175C675 182 680 187 687 187H805" stroke="#334155" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="path-draw" d="M681 223H663C656 223 651 218 651 211V176C651 169 646 164 639 164H520" stroke="#273449" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="rail-fill" x="541" y="167" width="237" height="3" rx="1.5" fill="url(#accent-line)"/>
    <circle class="signal" cx="550" cy="168.5" r="3.4" fill="#E0F2FE" filter="url(#blue-glow)"/>
  </g>

  <!-- Central execution core -->
  <g class="sans">
    <rect x="619" y="158" width="88" height="24" rx="12" fill="#0B1A2B" stroke="#38BDF8" stroke-opacity="0.42"/>
    <circle cx="632" cy="170" r="3" fill="#22D3EE" class="pulse-a"/>
    <text x="642" y="173.7" fill="#E0F2FE" font-size="8.5" font-weight="720" letter-spacing="0.9">EXECUTION</text>
  </g>

  <!-- Small engineering telemetry -->
  <g class="mono">
    <rect x="504" y="260" width="318" height="1" fill="#1E293B"/>
    <text x="504" y="273.5" fill="#475569" font-size="7.5" letter-spacing="1">SIGNAL / PRODUCT LOGIC / MOBILE SYSTEM / FEEDBACK</text>

    <g transform="translate(723 88)">
      <rect x="0" y="0" width="99" height="6" rx="3" fill="#111C2D"/>
      <rect class="bar-a" x="0" y="0" width="68" height="6" rx="3" fill="#38BDF8" fill-opacity="0.28"/>
      <rect class="scan" x="0" y="0" width="18" height="6" rx="3" fill="#67E8F9" fill-opacity="0.22"/>
    </g>

    <g transform="translate(504 88)">
      <rect x="0" y="0" width="99" height="6" rx="3" fill="#111C2D"/>
      <rect class="bar-b" x="0" y="0" width="74" height="6" rx="3" fill="#6366F1" fill-opacity="0.18"/>
    </g>
  </g>

  <!-- Corner markers -->
  <g stroke="#38BDF8" stroke-opacity="0.18" stroke-linecap="round" class="ambient">
    <path d="M474 60V46C474 41.6 477.6 38 482 38H496"/>
    <path d="M830 292H844C848.4 292 852 288.4 852 284V270"/>
  </g>
</svg>